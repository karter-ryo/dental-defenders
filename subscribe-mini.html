<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Subscribe — Smile Serenity Dental Care</title>
<style>
  :root{
    --brand:#0d3a6b;
    --brand-dark:#0a2c52;
    --ink:#1a2640;
    --dim:#6b7a90;
    --line:#cfd6e1;
    --ok-bg:#e8f7ef;
    --ok-fg:#0e6b48;
    --ok-line:#c4ebd4;
    --err-bg:#fce8eb;
    --err-fg:#872433;
    --err-line:#f3c4cc;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:transparent}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    color:var(--ink);
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }
  .ss-mini{
    max-width:560px;
    margin:0 auto;
    padding:8px;
  }
  .ss-mini .row{
    display:flex;
    gap:8px;
    align-items:stretch;
    flex-wrap:wrap;
  }
  .ss-mini .row .email{
    flex:1 1 220px;
    min-width:0;
  }
  .ss-mini input[type="email"]{
    width:100%;
    padding:11px 14px;
    border:1px solid var(--line);
    border-radius:8px;
    font-size:15px;
    font-family:inherit;
    color:var(--ink);
    background:#fff;
    transition:border-color .15s,box-shadow .15s;
    outline:none;
  }
  .ss-mini input[type="email"]:focus{
    border-color:var(--brand);
    box-shadow:0 0 0 3px rgba(13,58,107,.12);
  }
  .ss-mini button[type="submit"]{
    flex:0 0 auto;
    padding:11px 22px;
    border:none;
    background:#fff;
    color:var(--brand);
    font-size:15px;
    font-weight:700;
    letter-spacing:.02em;
    border-radius:8px;
    cursor:pointer;
    transition:background .15s,box-shadow .15s,transform .05s;
    font-family:inherit;
    white-space:nowrap;
    box-shadow:0 1px 2px rgba(0,0,0,.08), 0 2px 6px rgba(0,0,0,.06);
  }
  .ss-mini button[type="submit"]:hover{
    background:#f4f7fb;
    box-shadow:0 1px 2px rgba(0,0,0,.10), 0 4px 10px rgba(0,0,0,.08);
  }
  .ss-mini button[type="submit"]:active{transform:translateY(1px)}
  .ss-mini button[type="submit"][disabled]{
    background:#e7ecf3;
    color:var(--dim);
    cursor:not-allowed;
    box-shadow:none;
  }
  .ss-mini .consent{
    display:flex;
    align-items:flex-start;
    gap:8px;
    margin-top:10px;
    font-size:12px;
    color:var(--dim);
    line-height:1.4;
    cursor:pointer;
  }
  .ss-mini .consent input[type="checkbox"]{
    width:15px;height:15px;
    flex:none;
    margin-top:2px;
    accent-color:var(--brand);
    cursor:pointer;
  }
  .ss-mini .msg{
    display:none;
    margin-top:10px;
    padding:9px 12px;
    border-radius:8px;
    font-size:13px;
    line-height:1.4;
  }
  .ss-mini .msg.show{display:block}
  .ss-mini .msg.ok{color:var(--ok-fg);background:var(--ok-bg);border:1px solid var(--ok-line)}
  .ss-mini .msg.error{color:var(--err-fg);background:var(--err-bg);border:1px solid var(--err-line)}
  .ss-mini .honey{position:absolute;left:-5000px;width:1px;height:1px;overflow:hidden}
  /* On very narrow screens (older phones), button drops below the input */
  @media (max-width:340px){
    .ss-mini button[type="submit"]{ width:100%; }
  }
</style>
</head>
<body>
<div class="ss-mini" role="region" aria-label="Smile Serenity newsletter signup">
  <form id="ssmForm" novalidate>
    <div class="row">
      <div class="email">
        <label for="ssm-email" class="visually-hidden" style="position:absolute;left:-5000px">Email address</label>
        <input id="ssm-email" name="EMAIL" type="email" required maxlength="80" autocomplete="email" placeholder="Your email address" />
      </div>
      <button id="ssmSubmit" type="submit">Subscribe</button>
    </div>

    <label class="consent" for="ssm-consent">
      <input id="ssm-consent" type="checkbox" name="gdpr[340]" value="Y" required />
      <span>Send me dental-care tips, offers and news from Smile Serenity Dental Care. Unsubscribe any time.</span>
    </label>

    <div class="honey" aria-hidden="true">
      <label>Don't fill this in:
        <input type="text" name="b_3377b391a94a0a0707fe2129c_25e38ac421" tabindex="-1" value="" autocomplete="off" />
      </label>
    </div>

    <div id="ssmMsg" class="msg" role="status" aria-live="polite"></div>
  </form>
</div>

<script>
(function(){
  var form   = document.getElementById('ssmForm');
  var submit = document.getElementById('ssmSubmit');
  var msg    = document.getElementById('ssmMsg');
  // Smile Serenity audience — same as the in-game form and full signup card
  var ACTION = 'https://smileserenity.us2.list-manage.com/subscribe/post-json?u=3377b391a94a0a0707fe2129c&id=25e38ac421&f_id=00a8c1e1f0';

  function showMessage(kind, text){
    msg.className = 'msg show ' + kind;
    msg.textContent = text;
  }

  form.addEventListener('submit', function(e){
    e.preventDefault();
    msg.className = 'msg';
    if (!form.checkValidity()) { form.reportValidity(); return; }

    submit.disabled = true;
    var origText = submit.textContent;
    submit.textContent = 'Subscribing…';

    var fd = new FormData(form);
    var params = new URLSearchParams();
    fd.forEach(function(v, k){ params.append(k, v); });

    var cb = 'mcCb_' + Date.now() + '_' + Math.floor(Math.random() * 1e6);
    params.append('c', cb);

    var script;
    window[cb] = function(resp){
      try { delete window[cb]; } catch(e) { window[cb] = undefined; }
      if (script && script.parentNode) script.parentNode.removeChild(script);
      submit.disabled = false;
      submit.textContent = origText;
      if (resp && resp.result === 'success') {
        showMessage('ok', 'Thanks! Please check your inbox to confirm.');
        form.reset();
      } else {
        var m = (resp && resp.msg) ? String(resp.msg).replace(/<[^>]+>/g, '') : 'Sorry, something went wrong. Please try again.';
        m = m.replace(/^\d+\s*-\s*/, '');
        showMessage('error', m);
      }
    };

    script = document.createElement('script');
    script.src = ACTION + '&' + params.toString();
    script.onerror = function(){
      try { delete window[cb]; } catch(e){}
      submit.disabled = false;
      submit.textContent = origText;
      showMessage('error', 'Network problem — please try again.');
    };
    document.head.appendChild(script);
  });
})();
</script>
</body>
</html>
